<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tên màn hình - Bep Nè</title>
    <script src="../assets/js/khoi-dau.js"></script>
    <link rel="icon" href="../assets/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/img/icon-180.png">
    <link rel="stylesheet" href="../assets/css/site.css">
    <link rel="stylesheet" href="../assets/css/ung-dung.css">
</head>
<body>
    <div data-khung="dau-trang"></div>

    <main>
        <section class="hero-sp hero-sp--dm" id="banner">
            <img class="hero-sp__anh" src="../assets/img/banner-tai-khoan.jpg" alt="">
            <span class="hero-sp__phu" aria-hidden="true"></span>

            <div class="hero-sp__chu">
                <div class="khung">
                    <h1>Tên màn hình</h1>
                    <p>Một câu nói màn hình này giúp khách làm gì.</p>
                </div>
            </div>

            <div class="hero-sp__duoi">
                <div class="khung">
                    <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                        <a href="../khach/trang-chu.html">Trang chủ</a>
                        <span aria-hidden="true">&middot;</span>
                        <span aria-current="page">Tên màn hình</span>
                    </nav>
                </div>
            </div>
        </section>

        <section class="muc muc--sat-banner">
            <div class="khung khung--hep">
                <div class="the-tk">
                    <div class="o-nhap">
                        <label for="ho-ten">Họ và tên</label>
                        <input type="text" id="ho-ten" name="hoTen" placeholder="Nguyễn Văn An">
                    </div>

                    <div class="o-nhap">
                        <label for="so-dien-thoai">Số điện thoại</label>
                        <input type="tel" id="so-dien-thoai" name="soDienThoai" placeholder="0903 456 781">
                    </div>

                    <button class="nut nut--dac the-tk__gui" type="button">Gửi</button>
                </div>
            </div>
        </section>
    </main>

    <div data-khung="chan-trang"></div>

    <script src="../assets/js/khung.js"></script>
    <script src="../assets/js/site.js"></script>
</body>
</html>
