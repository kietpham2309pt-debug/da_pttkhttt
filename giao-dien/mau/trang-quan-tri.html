<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tên màn hình - Bep Nè</title>
    <script src="../assets/js/khoi-dau.js"></script>
    <link rel="icon" href="../assets/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/img/icon-180.png">
    <link rel="stylesheet" href="../assets/css/site.css">
    <link rel="stylesheet" href="../assets/css/ung-dung.css">
</head>
<body>
    <div data-khung="dau-trang"></div>

    <main>
        <section class="muc muc--dau-trang">
            <div class="khung khung--rong">
                <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                    <a href="../khach/trang-chu.html">Trang chủ</a>
                    <span aria-hidden="true">&middot;</span>
                    <a href="../quan-tri/tong-quan.html">Quản trị</a>
                    <span aria-hidden="true">&middot;</span>
                    <span aria-current="page">Tên màn hình</span>
                </nav>

                <div class="qt">
                    <nav class="qt-ben" aria-label="Menu quản trị" data-khung="menu-quan-tri" data-chon="ma-muc"></nav>

                    <div>
                        <div class="qt-dau">
                            <div>
                                <h1>Tên màn hình</h1>
                                <p>Một câu nói nhân viên dùng màn hình này để làm gì.</p>
                            </div>
                            <div class="qt-dau__nut">
                                <a class="nut nut--dac nut--nho" href="#">Thêm mới</a>
                            </div>
                        </div>

                        <div class="thanh-loc">
                            <form action="#" method="get">
                                <input type="search" name="tuKhoa" placeholder="Tìm theo mã hoặc tên" aria-label="Từ khoá">
                                <select name="trangThai" aria-label="Trạng thái">
                                    <option value="">Tất cả trạng thái</option>
                                    <option value="mo">Đang mở</option>
                                    <option value="dong">Đã đóng</option>
                                </select>
                                <button class="nut nut--nho" type="submit">Lọc</button>
                            </form>
                        </div>

                        <div class="khoi">
                            <div class="cuon-ngang">
                                <table class="bang-dl">
                                    <thead>
                                    <tr>
                                        <th>Mã</th>
                                        <th>Tên</th>
                                        <th class="canh-phai">Số tiền</th>
                                        <th>Trạng thái</th>
                                        <th class="canh-phai">Thao tác</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr>
                                        <td class="ma-mo">PN-0012</td>
                                        <td>Dòng dữ liệu mẫu thứ nhất</td>
                                        <td class="canh-phai">54.600.000 ₫</td>
                                        <td><span class="the-nhan the-nhan--ok">Đã duyệt</span></td>
                                        <td>
                                            <div class="hang-thao-tac">
                                                <a class="nut nut--nho" href="#">Sửa</a>
                                                <button class="nut nut--nho nut--do" type="button">Xoá</button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="ma-mo">PN-0013</td>
                                        <td>Dòng dữ liệu mẫu thứ hai</td>
                                        <td class="canh-phai">18.200.000 ₫</td>
                                        <td><span class="the-nhan the-nhan--vang">Chờ duyệt</span></td>
                                        <td>
                                            <div class="hang-thao-tac">
                                                <a class="nut nut--nho" href="#">Sửa</a>
                                                <button class="nut nut--nho nut--do" type="button">Xoá</button>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-khung="chan-trang"></div>

    <script src="../assets/js/menu-quan-tri.js"></script>
    <script src="../assets/js/khung.js"></script>
    <script src="../assets/js/site.js"></script>
</body>
</html>
