<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Bep Nè</title>
    <script src="../assets/js/khoi-dau.js"></script>
    <link rel="icon" href="../assets/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/img/icon-180.png">
    <link rel="stylesheet" href="../assets/css/site.css">
    <link rel="stylesheet" href="../assets/css/ung-dung.css">
</head>
<body>
    <div data-khung="dau-trang"></div>

    <main>
        

<section class="hero-sp hero-sp--dm" id="banner">

    <img class="hero-sp__anh" src="../assets/img/banner-tai-khoan.jpg" alt="" />

    <span class="hero-sp__phu" aria-hidden="true"></span>

    <div class="hero-sp__chu">
        <div class="khung">
            <h1>Đăng nhập</h1>
                <p>Đăng nhập để theo dõi đơn hàng và lưu địa chỉ giao.</p>
        </div>
    </div>

        <div class="hero-sp__duoi">
            <div class="khung">
                <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                            <a href="trang-chu.html">Trang chủ</a>
                            <span aria-hidden="true">&middot;</span>
                            <span aria-current="page">Đăng nhập</span>
                </nav>
            </div>
        </div>
</section>

<section class="muc muc--sat-banner">
    <div class="khung khung--hep">

        <div class="the-tk hien-dan">

<form action="../quan-tri/tong-quan.html" method="get"><div class="o-nhap">
                    <label for="Email">Email</label>
                    <input autocomplete="email" data-val="true" data-val-email="Email không đúng dạng, ví dụ đúng: Huit@edu.com.vn" data-val-required="Bạn chưa nhập email." id="Email" name="Email" placeholder="Huit@edu.com.vn" type="email" value="" />
                    <span class="field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
                </div>
                <div class="o-nhap">
                    <label for="MatKhau">Mật khẩu</label>
                    <input autocomplete="current-password" data-val="true" data-val-required="Bạn chưa nhập mật khẩu." id="MatKhau" name="MatKhau" type="password" />
                    <span class="field-validation-valid" data-valmsg-for="MatKhau" data-valmsg-replace="true"></span>
                </div>
                <label class="o-tich">
                    <input data-val="true" data-val-required="The Ghi nhớ đăng nhập field is required." id="GhiNho" name="GhiNho" type="checkbox" value="true" /><input name="GhiNho" type="hidden" value="false" />
                    <span class="o-tich__o" aria-hidden="true"></span>
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <button type="submit" class="nut nut--dac the-tk__gui">Đăng nhập</button>
</form>
            <p class="the-tk__doi">
                Chưa có tài khoản?
                <a href="dang-ky.html">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</section>

    
    </main>

    <div data-khung="chan-trang"></div>

    <script src="../assets/js/khung.js"></script>
    <script src="../assets/js/site.js"></script>
</body>
</html>
