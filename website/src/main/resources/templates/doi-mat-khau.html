<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/khung :: dau('Đổi mật khẩu')}"></head>
<body>
<th:block th:replace="~{layout/khung :: dauTrang}"></th:block>
<main>
    <section class="hero-sp hero-sp--dm" id="banner">
        <img class="hero-sp__anh" src="/assets/img/banner-tai-khoan.jpg" alt="">
        <span class="hero-sp__phu" aria-hidden="true"></span>
        <div class="hero-sp__chu">
            <div class="khung">
                <h1>Đổi mật khẩu</h1>
                <p th:if="${param.lanDau}">Đây là lần đăng nhập đầu tiên, bạn cần đổi mật khẩu được cấp.</p>
                <p th:unless="${param.lanDau}">Đổi xong, các phiên đăng nhập khác phải đăng nhập lại.</p>
            </div>
        </div>
    </section>
    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <div class="the-tk">
                <th:block th:replace="~{layout/khung :: thongBao}"></th:block>
                <form th:action="@{/doi-mat-khau}" method="post">
                    <div class="o-nhap">
                        <label for="cu">Mật khẩu hiện tại</label>
                        <input id="cu" name="matKhauCu" type="password" required autocomplete="current-password">
                    </div>
                    <div class="o-nhap">
                        <label for="moi">Mật khẩu mới (ít nhất 6 ký tự)</label>
                        <input id="moi" name="matKhauMoi" type="password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="o-nhap">
                        <label for="nhac">Nhập lại mật khẩu mới</label>
                        <input id="nhac" name="nhapLai" type="password" required minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="nut nut--dac the-tk__gui">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{layout/khung :: chanTrang}"></th:block>
</body>
</html>
