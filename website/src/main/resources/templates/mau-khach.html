<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/khung :: dau('Tên màn hình')}"></head>
<body>
<th:block th:replace="~{layout/khung :: dauTrang}"></th:block>
<main>
    <section class="hero-sp hero-sp--dm" id="banner">
        <img class="hero-sp__anh" src="/assets/img/banner-tai-khoan.jpg" alt="">
        <span class="hero-sp__phu" aria-hidden="true"></span>
        <div class="hero-sp__chu">
            <div class="khung">
                <h1>Tên màn hình</h1>
                <p>Một câu nói màn hình này giúp khách làm gì.</p>
            </div>
        </div>
        <div class="hero-sp__duoi">
            <div class="khung">
                <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                    <a href="/">Trang chủ</a>
                    <span aria-hidden="true">&middot;</span>
                    <span aria-current="page">Tên màn hình</span>
                </nav>
            </div>
        </div>
    </section>
    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <th:block th:replace="~{layout/khung :: thongBao}"></th:block>
            <div class="the-tk">
                <p>Nội dung.</p>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{layout/khung :: chanTrang}"></th:block>
</body>
</html>
